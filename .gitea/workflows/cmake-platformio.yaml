name: Original firmware build and release
'on':
  push:
    branches:
    - main
    - develop
    paths:
    - code/RocketLauncher/**
    - .gitea/workflows/**
  pull_request:
    branches:
    - main
    paths:
    - code/RocketLauncher/**
  create: {}
  release:
    types:
    - published
    - created
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version (e.g., 1.0.0)
        required: true
        type: string
permissions:
  contents: write
  actions: read
jobs:
  firmware:
    if: ${{ github.event_name != 'create' || (github.event.ref_type == 'tag' && github.event.ref == github.ref && startsWith(github.ref,
      'refs/tags/v')) }}
    uses: self:KofTwentyTwo/platform-ci/.gitea/workflows/cmake-platformio.yaml@kof-release-v1
    with:
      runner: linux-small
      version: ${{ github.event.inputs.version }}
